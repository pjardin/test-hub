{% extends "core/base.html" %}
{% block title %}Sign in — Test Hub{% endblock %}
{% block content %}

<div class="card" style="max-width: 420px; margin: 60px auto">
  <h2>&#128274; Test Hub</h2>
  <p class="help">This hub is protected by a shared password
    (<code>site.password</code> in config.json). Ask whoever set it up.</p>
  {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label class="field"><span>Password</span>
      <input type="password" name="password" autofocus required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

{% endblock %}
